[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tlapse"
version = "0.1.0"
description = "RTSP timelapse capture with averaged frames and safe HEVC video output"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy", "opencv-python-headless"]

[project.scripts]
tlapse = "tlapse.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
